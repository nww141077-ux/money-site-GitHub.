<body>
<header class="topbar">
  <div class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">Мой проект</a></div>

    <a href="https://dzen.ru/ТВОЙ_НИК" target="_blank">Мой Дзен</a>

<main>
  <article class="card" id="articleBox" style="margin-top:24px;">
    <div class="date" id="aDate"></div>
    <h1 id="aTitle" style="margin-bottom:12px;"></h1>
    <div id="aContent" style="white-space:pre-wrap;color:var(--text);"></div>

  <div class="card" style="margin-top:24px;">
    <p><b>Понравилась статья?</b> Полные версии — на моём канале в Дзене.

  </div>
</main>
<footer><p>© 2026 Мой проект</p></footer>
<script>
const slug = new URLSearchParams(location.search).get('slug');
fetch('data/articles.json')
  .then(r => r.json())
  .then(data => {
    const a = data.articles.find(x => x.slug === slug) || data.articles[0];
    document.title = a.title + ' — Мой проект';
    document.getElementById('aDate').textContent = a.date;
    document.getElementById('aTitle').textContent = a.title;
    document.getElementById('aContent').textContent = a.content;
  });
</script>
<script src="app.js"></script>
</body>
